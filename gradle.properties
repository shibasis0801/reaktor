android.useAndroidX=true
kotlin.code.style=official
kotlin.js.ir.output.granularity=whole-program

# Select the runtime JDK through JAVA_HOME or per-machine Gradle settings.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
#Compose
org.jetbrains.compose.experimental.uikit.enabled=true
org.jetbrains.compose.experimental.jscanvas.enabled=true
kotlin.mpp.enableCInteropCommonization=true

# Keep the existing KMP Android plugin integration while using SDK 37 / Compose 1.12.
android.builtInKotlin=false
android.newDsl=false
ksp.useKSP2=true

# Build Performance Optimizations
org.gradle.parallel=true
org.gradle.workers.max=3
org.gradle.caching=true
org.gradle.daemon=true

# Kotlin Optimizations
kotlin.incremental=true
kotlin.incremental.native=false
kotlin.incremental.multiplatform=true
kotlin.incremental.js=true
kotlin.incremental.js.ir=true
kotlin.build.report.output=file

# Native Optimizations
kotlin.native.ignoreDisabledTargets=true

# Android Build Optimizations  
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true
kotlin.suppressGradlePluginWarnings=NonKmpAgpIsDeprecated
kotlin.js.yarn=false
kotlin.daemon.jvmargs=-Xmx8g
